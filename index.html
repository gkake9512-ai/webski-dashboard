<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webski タスク進捗ダッシュボード</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f5f5f0;padding:20px;color:#1a1a1a}
  .container{max-width:680px;margin:0 auto}
  h1{font-size:18px;font-weight:500;margin-bottom:4px}
  .updated{font-size:12px;color:#888;margin-bottom:20px}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .metric{background:#fff;border-radius:10px;padding:14px;text-align:center}
  .metric-label{font-size:11px;color:#888;margin-bottom:4px}
  .metric-val{font-size:22px;font-weight:500}
  .cat-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
  .cat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cat-name{font-size:14px;font-weight:500}
  .cat-right{display:flex;align-items:center;gap:10px}
  .cat-count{font-size:12px;color:#888}
  .cat-pct{font-size:14px;font-weight:500}
  .bar-bg{height:8px;background:#f0f0ec;border-radius:4px;overflow:hidden;margin-bottom:10px}
  .bar-fill{height:100%;border-radius:4px;transition:width .3s}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .overall{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
  .overall-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .overall-title{font-size:14px;font-weight:500}
  .overall-pct{font-size:20px;font-weight:500;color:#1D9E75}
</style>
</head>
<body>
<div class="container">
  <h1>📊 Webski タスク進捗ダッシュボード</h1>
  <div class="updated">最終更新：2026/07/10 20:51（30分ごと自動更新）</div>

  <div class="metrics">
    <div class="metric"><div class="metric-label">総タスク数</div><div class="metric-val">54</div></div>
    <div class="metric"><div class="metric-label">未着手</div><div class="metric-val" style="color:#185FA5">23</div></div>
    <div class="metric"><div class="metric-label">進行中</div><div class="metric-val" style="color:#3B6D11">10</div></div>
    <div class="metric"><div class="metric-label">完了</div><div class="metric-val" style="color:#0F6E56">21</div></div>
  </div>

  <div class="overall">
    <div class="overall-header">
      <span class="overall-title">全体進捗</span>
      <span class="overall-pct">39%</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" style="width:39%;background:#1D9E75"></div></div>
    <div style="font-size:12px;color:#888;text-align:right">21 / 54 件完了</div>
  </div>

  
        <div class="cat-card">
            <div class="cat-header">
                <div class="cat-name">📘 マニュアルタスク</div>
                <div class="cat-right">
                    <span class="cat-count">29件</span>
                    <span class="cat-pct" style="color:#378ADD">3%</span>
                </div>
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width:3%;background:#378ADD"></div></div>
            <div class="badges"><span class="badge" style="background:#E6F1FB;color:#185FA5"><span class="dot" style="background:#185FA5"></span>未着手 20</span><span class="badge" style="background:#EAF3DE;color:#3B6D11"><span class="dot" style="background:#3B6D11"></span>進行中 8</span><span class="badge" style="background:#FAEEDA;color:#854F0B"><span class="dot" style="background:#854F0B"></span>確認待ち 0</span><span class="badge" style="background:#E1F5EE;color:#0F6E56"><span class="dot" style="background:#0F6E56"></span>完了 1</span><span class="badge" style="background:#FCEBEB;color:#A32D2D"><span class="dot" style="background:#A32D2D"></span>保留 0</span></div>
        </div>
        <div class="cat-card">
            <div class="cat-header">
                <div class="cat-name">🔧 作業タスク</div>
                <div class="cat-right">
                    <span class="cat-count">21件</span>
                    <span class="cat-pct" style="color:#EF9F27">81%</span>
                </div>
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width:81%;background:#EF9F27"></div></div>
            <div class="badges"><span class="badge" style="background:#E6F1FB;color:#185FA5"><span class="dot" style="background:#185FA5"></span>未着手 2</span><span class="badge" style="background:#EAF3DE;color:#3B6D11"><span class="dot" style="background:#3B6D11"></span>進行中 2</span><span class="badge" style="background:#FAEEDA;color:#854F0B"><span class="dot" style="background:#854F0B"></span>確認待ち 0</span><span class="badge" style="background:#E1F5EE;color:#0F6E56"><span class="dot" style="background:#0F6E56"></span>完了 17</span><span class="badge" style="background:#FCEBEB;color:#A32D2D"><span class="dot" style="background:#A32D2D"></span>保留 0</span></div>
        </div>
        <div class="cat-card">
            <div class="cat-header">
                <div class="cat-name">✏️ 作成タスク</div>
                <div class="cat-right">
                    <span class="cat-count">4件</span>
                    <span class="cat-pct" style="color:#639922">75%</span>
                </div>
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width:75%;background:#639922"></div></div>
            <div class="badges"><span class="badge" style="background:#E6F1FB;color:#185FA5"><span class="dot" style="background:#185FA5"></span>未着手 1</span><span class="badge" style="background:#EAF3DE;color:#3B6D11"><span class="dot" style="background:#3B6D11"></span>進行中 0</span><span class="badge" style="background:#FAEEDA;color:#854F0B"><span class="dot" style="background:#854F0B"></span>確認待ち 0</span><span class="badge" style="background:#E1F5EE;color:#0F6E56"><span class="dot" style="background:#0F6E56"></span>完了 3</span><span class="badge" style="background:#FCEBEB;color:#A32D2D"><span class="dot" style="background:#A32D2D"></span>保留 0</span></div>
        </div>
</div>
</body>
</html>
